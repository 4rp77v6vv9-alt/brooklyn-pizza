<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brooklyn Pizza POS — настройка</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#303030,#101010 70%);font:16px/1.45 system-ui,Segoe UI,sans-serif;color:#fff;padding:24px}.card{width:min(560px,100%);background:#1b1b1b;border:1px solid #3a3a3a;border-radius:24px;padding:32px;box-shadow:0 30px 80px #0009}h1{margin:0 0 6px;font-size:30px}.brand{color:#ff7a00;font-weight:900;letter-spacing:.16em;margin-bottom:20px}p{color:#bdbdbd}label{display:grid;gap:8px;margin-top:22px;font-weight:700}input{width:100%;padding:15px 16px;border:1px solid #505050;border-radius:13px;background:#0f0f0f;color:#fff;font:inherit;outline:none}input:focus{border-color:#ff7a00;box-shadow:0 0 0 3px #ff7a0029}button{margin-top:20px;width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(#ff9933,#ff6a00);color:#171717;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 10px 24px #ff6a0030}.error{margin-top:14px;padding:12px;border-radius:10px;background:#4a1818;color:#ffd5d5}.hint{font-size:13px;color:#8e8e8e}</style></head><body><form class="card" id="form"><div class="brand">BROOKLYN PIZZA</div><h1>Первый запуск POS</h1><p>Укажите адрес вашего сайта. Windows-программа будет работать с той же базой товаров, заказов и Brooklyn Club.</p><label>Адрес сервера<input id="server" type="url" placeholder="https://ваш-домен.ru" required></label><div class="hint">Адрес сохраняется только на этом кассовом компьютере.</div><button type="submit">Подключить кассу</button><div class="error" id="error" hidden></div></form><script>const form=document.getElementById('form'),server=document.getElementById('server'),error=document.getElementById('error');window.brooklynDesktop.getConfig().then(c=>{if(c&&c.serverUrl)server.value=c.serverUrl});form.addEventListener('submit',async e=>{e.preventDefault();error.hidden=true;const current=await window.brooklynDesktop.getConfig();const result=await window.brooklynDesktop.saveConfig({...current,serverUrl:server.value.trim()});if(!result.ok){error.textContent=result.error||'Не удалось сохранить';error.hidden=false}});</script></body></html>
