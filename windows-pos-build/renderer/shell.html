<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brooklyn Pizza POS</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.bar{height:58px;display:flex;align-items:center;background:linear-gradient(135deg,#25292c 0%,#181b1d 72%,#211c18 100%);border-bottom:1px solid #34393d;box-shadow:0 6px 22px #0007,inset 0 1px 0 #ffffff0b;-webkit-app-region:drag;user-select:none}
.brand{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;min-width:188px}
.logo{width:32px;height:32px;border-radius:11px;background:linear-gradient(145deg,#ff9c3b,#f36f16);display:grid;place-items:center;color:#151718;font-weight:1000;font-size:12px;box-shadow:inset 0 1px 0 #fff7,0 5px 16px #f47a2438,0 0 0 1px #ffae6150}
.name{font-weight:900;font-size:13px;line-height:1.02;white-space:nowrap}.sub{font-size:8px;color:#9da2aa;margin-top:3px;letter-spacing:.07em;white-space:nowrap}
.nav{height:100%;display:flex;align-items:center;gap:5px;-webkit-app-region:no-drag;min-width:0}
.nav button{position:relative;height:42px;border:1px solid #3b4145;border-radius:11px;background:linear-gradient(180deg,#2d3235,#24282b);color:#f1f3f4;padding:0 13px;font:750 12px system-ui;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px 0 #ffffff10,0 3px 8px #0003;transition:transform .08s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease}
.nav button:hover{background:linear-gradient(#383e42,#2a2f32);border-color:#50585d}.nav button:active{transform:translateY(1px)}.nav button.active{background:linear-gradient(#333a3d,#292e31);box-shadow:inset 0 -3px 0 #43c4d4,inset 0 1px 0 #ffffff16,0 5px 12px #0004;border-color:#3e464a}
.nav button.egais{border-color:#6f4a22;background:linear-gradient(#40301e,#2e271f);color:#ffd6a8}.nav button.egais:hover{border-color:#a36b2f;background:linear-gradient(#4b351f,#34291f)}
.badge{display:none;position:absolute;right:4px;top:3px;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:#e64a3b;color:#fff;font:800 10px/18px system-ui}.badge.show{display:block}
.spacer{flex:1;min-width:8px}
.windows{height:100%;display:flex;align-items:center;-webkit-app-region:no-drag;padding-right:6px;gap:2px}
.win{width:44px;height:42px;border:0;border-radius:11px;background:transparent;color:#c8cbd0;font-size:18px;cursor:pointer;transition:background .15s ease,color .15s ease,transform .08s ease}.win:hover{background:#ffffff0d}.win:active{transform:translateY(1px)}
.win.settings{font-size:19px}.win.confirm{background:#1f8f4d;color:white;box-shadow:inset 0 1px 0 #ffffff2b,0 0 0 1px #3cd87855}
.connect{position:absolute;top:58px;left:0;right:0;bottom:0;display:grid;place-items:center;pointer-events:none;color:#60656c;font-size:14px}
@media(max-width:1260px){.brand{min-width:155px}.name{font-size:11px}.nav button{padding:0 8px;font-size:10px}}
</style></head><body>
<div class="bar">
  <div class="brand"><div class="logo">BP</div><div><div class="name">Brooklyn Pizza POS</div><div class="sub">WINDOWS · 20.31.51</div></div></div>
  <nav class="nav" aria-label="Разделы POS">
    <button data-pos="0" class="active">Продажи</button>
    <button data-pos="1">Заказы<span id="orderBadge" class="badge"></span></button>
    <button data-pos="2" id="savedTab">Отложенные · 0</button>
    <button data-pos="3">История заказов</button>
    <button data-pos="4">Смена и отчёты</button>
    <button class="egais" id="egais">ЕГАИС</button>
  </nav>
  <div class="spacer"></div>
  <div class="windows">
    <button class="win settings" id="settings" title="Настройки">⚙</button>
    <button class="win" id="min" title="Свернуть">—</button>
    <button class="win" id="close" title="Закрыть">×</button>
  </div>
</div>
<div class="connect">Рабочая область POS загружается…</div>
<script>
const api=window.brooklynDesktop;
const nav=[...document.querySelectorAll('[data-pos]')];
nav.forEach(button=>button.addEventListener('click',()=>api.navigatePos(Number(button.dataset.pos))));
document.getElementById('egais').onclick=()=>api.openEgais();
document.getElementById('settings').onclick=()=>api.openHardwareSettings();

async function syncNav(){
  try{
    const state=await api.getPosNavState();
    if(!state?.ready)return;
    nav.forEach((button,index)=>button.classList.toggle('active',index===state.active));
    const badge=document.getElementById('orderBadge');
    const count=String(state.orderCount||'').trim();
    badge.textContent=count;
    badge.classList.toggle('show',Boolean(count));
    document.getElementById('savedTab').textContent=state.savedLabel||'Отложенные · 0';
  }catch{}
}
setInterval(syncNav,600);syncNav();

function armSecondClick(button,action,label){
  let armed=false,timer=null;
  button.addEventListener('click',()=>{
    if(armed){clearTimeout(timer);armed=false;button.classList.remove('confirm');action();return}
    armed=true;button.classList.add('confirm');button.title=label+' — нажмите ещё раз';
    timer=setTimeout(()=>{armed=false;button.classList.remove('confirm');button.title=label},3500)
  });
}
armSecondClick(document.getElementById('min'),()=>api.minimize(),'Свернуть');
armSecondClick(document.getElementById('close'),()=>api.close(),'Закрыть');
</script></body></html>
