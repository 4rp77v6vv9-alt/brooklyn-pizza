<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brooklyn Pizza POS</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0e0f11;color:#fff;font:14px system-ui,Segoe UI,sans-serif}
.toolbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 18px;background:linear-gradient(180deg,#1c1e22,#14161a);border-bottom:1px solid #2b2e33;box-shadow:0 2px 12px #0006;user-select:none}
.left,.right{display:flex;align-items:center;gap:10px}.brand{font-weight:900;letter-spacing:.08em}.brand b{color:#ff7a00}.status{display:flex;align-items:center;gap:7px;color:#aeb3ba;font-size:12px;padding-left:10px;border-left:1px solid #34373d}.dot{width:9px;height:9px;border-radius:50%;background:#888}.dot.online{background:#37d67a;box-shadow:0 0 0 3px #37d67a20}.dot.loading{background:#ffb02e;box-shadow:0 0 0 3px #ffb02e20}.dot.offline{background:#ff5c5c;box-shadow:0 0 0 3px #ff5c5c20}
button{height:36px;border:1px solid #353941;border-radius:10px;background:#202329;color:#f4f4f4;padding:0 12px;font-weight:750;cursor:pointer;display:flex;align-items:center;gap:7px}button:hover{background:#2a2e35}button.primary{background:linear-gradient(#ff9736,#ff7500);border:0;color:#171717}.ver{font-size:11px;color:#71767f}
</style></head><body><div class="toolbar"><div class="left"><div class="brand"><b>BROOKLYN</b> PIZZA POS</div><div class="status"><span id="dot" class="dot loading"></span><span id="state">Подключение…</span></div><div id="server" class="ver"></div></div><div class="right"><span class="ver">v20.31.49</span><button id="reload">↻ Обновить</button><button id="settings">⚙ Оборудование</button><button id="fullscreen" class="primary">⛶ На весь экран</button></div></div><script>
const $=id=>document.getElementById(id)
function render(s={}){const dot=$('dot'),state=$('state'),server=$('server');dot.className='dot '+(s.status||'loading');state.textContent=s.status==='online'?'Подключено':s.status==='offline'?'Нет связи':'Подключение…';try{server.textContent=s.server?new URL(s.server).host:''}catch{server.textContent=''}if(s.error&&s.status==='offline')state.title=s.error}
window.brooklynDesktop.onPosState(render)
window.brooklynDesktop.onFullscreen(v=>$('fullscreen').textContent=v?'🗗 Выйти из полного экрана':'⛶ На весь экран')
$('reload').onclick=()=>window.brooklynDesktop.reloadPos()
$('settings').onclick=()=>window.brooklynDesktop.openHardwareSettings()
$('fullscreen').onclick=()=>window.brooklynDesktop.toggleFullscreen()
</script></body></html>
