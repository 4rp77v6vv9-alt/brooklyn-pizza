<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rita POS</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fa;color:#17212b;font-family:Inter,Segoe UI,system-ui,-apple-system,sans-serif}
.bar{height:76px;display:flex;align-items:center;background:rgba(255,255,255,.97);border-bottom:1px solid #e6ebf0;box-shadow:0 6px 24px rgba(29,41,55,.07);-webkit-app-region:drag;user-select:none;padding:0 10px}
.brand{display:flex;align-items:center;gap:11px;padding:0 16px 0 4px;min-width:330px}
.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#ff5a1f,#ef3d34);display:grid;place-items:center;color:white;font-weight:1000;font-size:18px;letter-spacing:-1px;box-shadow:0 9px 22px rgba(239,61,52,.24),inset 0 1px 0 rgba(255,255,255,.3)}
.brandText{min-width:0}.name{font-weight:950;font-size:20px;line-height:1;white-space:nowrap;letter-spacing:-.02em}.sub{font-size:8.7px;color:#7a8692;margin-top:5px;letter-spacing:.025em;white-space:nowrap;text-transform:lowercase}.version{font-size:8px;color:#a5adb6;margin-top:2px;letter-spacing:.08em}
.nav{height:100%;display:flex;align-items:center;gap:7px;-webkit-app-region:no-drag;min-width:0}
.nav button{position:relative;height:46px;border:1px solid #e5eaf0;border-radius:13px;background:#f7f9fb;color:#33404c;padding:0 15px;font:800 12px system-ui;cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px rgba(25,37,51,.04);transition:transform .08s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease,color .15s ease}
.nav button:hover{background:#fff;border-color:#d7dee6;box-shadow:0 5px 14px rgba(25,37,51,.07)}.nav button:active{transform:translateY(1px)}
.nav button.active{background:linear-gradient(135deg,#ff5a1f,#f1432f);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(244,67,47,.22)}
.nav button.egais{background:#fff;border-color:#e3e8ee;color:#5c6874}.nav button.egais:hover{border-color:#cfd7df;color:#28333d}
.badge{display:none;position:absolute;right:5px;top:4px;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:#e9362d;color:#fff;font:900 10px/18px system-ui;border:2px solid white}.badge.show{display:block}
.spacer{flex:1;min-width:8px}
.windows{height:100%;display:flex;align-items:center;-webkit-app-region:no-drag;padding-right:2px;gap:3px}
.win{width:44px;height:44px;border:1px solid transparent;border-radius:12px;background:transparent;color:#6f7a85;font-size:18px;cursor:pointer;transition:.15s ease}.win:hover{background:#f4f7fa;border-color:#e8edf2;color:#28333d}.win:active{transform:translateY(1px)}
.win.settings{font-size:19px}.win.confirm{background:#1fa460;color:white;border-color:#16894f;box-shadow:0 7px 16px rgba(31,164,96,.18)}
.connect{position:absolute;top:76px;left:0;right:0;bottom:0;display:grid;place-items:center;pointer-events:none;color:#9aa3ad;font-size:14px;background:#f4f7fa}
@media(max-width:1360px){.brand{min-width:280px}.sub{font-size:7.8px}.nav button{padding:0 10px;font-size:11px}.name{font-size:18px}}
@media(max-width:1180px){.brand{min-width:225px}.sub{max-width:160px;overflow:hidden;text-overflow:ellipsis}.nav{gap:4px}.nav button{padding:0 8px;font-size:10px}}
</style></head><body>
<div class="bar">
  <div class="brand"><div class="logo">RP</div><div class="brandText"><div class="name">Rita POS</div><div class="sub">ресторанные информационные технологии и автоматизация</div><div class="version">WINDOWS · 1.0.0</div></div></div>
  <nav class="nav" aria-label="Разделы POS">
    <button data-pos="0" class="active">Продажи</button>
    <button data-pos="1">Заказы<span id="orderBadge" class="badge"></span></button>
    <button data-pos="2" id="savedTab">Отложенные · 0</button>
    <button data-pos="3">История заказов</button>
    <button data-pos="4">Смена и отчёты</button>
    <button class="egais" id="egais">ЕГАИС</button>
  </nav>
  <div class="spacer"></div>
  <div class="windows">
    <button class="win settings" id="settings" title="Настройки">⚙</button>
    <button class="win" id="min" title="Свернуть">—</button>
    <button class="win" id="close" title="Закрыть">×</button>
  </div>
</div>
<div class="connect">Rita POS загружается…</div>
<script>
const api=window.brooklynDesktop;
const nav=[...document.querySelectorAll('[data-pos]')];
nav.forEach(button=>button.addEventListener('click',()=>api.navigatePos(Number(button.dataset.pos))));
document.getElementById('egais').onclick=()=>api.openEgais();
document.getElementById('settings').onclick=()=>api.openHardwareSettings();

async function syncNav(){
  try{
    const state=await api.getPosNavState();
    if(!state?.ready)return;
    nav.forEach((button,index)=>button.classList.toggle('active',index===state.active));
    const badge=document.getElementById('orderBadge');
    const count=String(state.orderCount||'').trim();
    badge.textContent=count;
    badge.classList.toggle('show',Boolean(count));
    document.getElementById('savedTab').textContent=state.savedLabel||'Отложенные · 0';
  }catch{}
}
setInterval(syncNav,600);syncNav();

function armSecondClick(button,action,label){
  let armed=false,timer=null;
  button.addEventListener('click',()=>{
    if(armed){clearTimeout(timer);armed=false;button.classList.remove('confirm');action();return}
    armed=true;button.classList.add('confirm');button.title=label+' — нажмите ещё раз';
    timer=setTimeout(()=>{armed=false;button.classList.remove('confirm');button.title=label},3500)
  });
}
armSecondClick(document.getElementById('min'),()=>api.minimize(),'Свернуть');
armSecondClick(document.getElementById('close'),()=>api.close(),'Закрыть');
</script></body></html>
