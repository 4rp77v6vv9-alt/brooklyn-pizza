<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brooklyn Pizza POS</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.bar{height:58px;display:flex;align-items:center;background:linear-gradient(180deg,#202225,#17191c);border-bottom:1px solid #32353a;box-shadow:0 4px 18px #0005;-webkit-app-region:drag;user-select:none}
.brand{display:flex;align-items:center;gap:12px;padding:0 18px;min-width:255px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#ff9b35,#ff6800);display:grid;place-items:center;color:#161616;font-weight:1000;box-shadow:inset 0 1px 0 #fff6,0 5px 14px #ff730035}
.name{font-weight:900;font-size:15px;line-height:1.05}.sub{font-size:10px;color:#9da2aa;margin-top:3px;letter-spacing:.08em}
.tools{display:flex;align-items:center;gap:8px;-webkit-app-region:no-drag}
.tool{height:36px;padding:0 14px;border:1px solid #3a3d42;border-radius:11px;background:linear-gradient(#2a2d31,#202327);color:#e9eaec;font:700 13px system-ui;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff12,0 4px 12px #0003}
.tool:hover{border-color:#50545b;background:linear-gradient(#32363b,#25282d)}.tool:active{transform:translateY(1px)}
.tool.accent{border-color:#7c491b;background:linear-gradient(#ff9636,#ed7000);color:#191919}
.spacer{flex:1}
.windows{height:100%;display:flex;-webkit-app-region:no-drag}
.win{width:48px;border:0;background:transparent;color:#c8cbd0;font-size:17px;cursor:pointer}
.win:hover{background:#ffffff0d}.win.close:hover{background:#d83b3b;color:white}
.connect{position:absolute;top:58px;left:0;right:0;bottom:0;display:grid;place-items:center;pointer-events:none;color:#60656c;font-size:14px}
@media(max-width:900px){.brand{min-width:210px}.tool span{display:none}.tool{padding:0 11px}}
</style></head><body>
<div class="bar">
  <div class="brand"><div class="logo">BP</div><div><div class="name">Brooklyn Pizza POS</div><div class="sub">WINDOWS · 20.31.48</div></div></div>
  <div class="tools">
    <button class="tool accent" id="hardware">⚙ <span>Оборудование</span></button>
    <button class="tool" id="server">◉ <span>Сервер</span></button>
    <button class="tool" id="reload">↻ <span>Обновить</span></button>
    <button class="tool" id="fullscreen">⛶ <span>Во весь экран</span></button>
  </div>
  <div class="spacer"></div>
  <div class="windows">
    <button class="win" id="min" title="Свернуть">—</button>
    <button class="win" id="max" title="Развернуть">□</button>
    <button class="win close" id="close" title="Закрыть">×</button>
  </div>
</div>
<div class="connect">Рабочая область POS загружается…</div>
<script>
const api=window.brooklynDesktop
document.getElementById('hardware').onclick=()=>api.openHardwareSettings()
document.getElementById('server').onclick=()=>api.openServerSettings()
document.getElementById('reload').onclick=()=>api.reloadPos()
document.getElementById('fullscreen').onclick=()=>api.toggleFullscreen()
document.getElementById('min').onclick=()=>api.minimize()
document.getElementById('max').onclick=()=>api.toggleMaximize()
document.getElementById('close').onclick=()=>api.close()
</script></body></html>
