<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brooklyn Pizza POS — ЕГАИС</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d0e10;color:#f3f3f3;font:14px/1.4 system-ui,Segoe UI,sans-serif}
body{overflow:hidden}.app{height:100%;display:grid;grid-template-rows:auto auto 1fr}.top{padding:18px 20px 12px;border-bottom:1px solid #2b2f34;background:#131519}.brand{font-size:10px;letter-spacing:.16em;color:#ff8c25;font-weight:900}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top h1{font-size:25px;margin:4px 20px 0 0}.status{margin-left:auto;padding:7px 10px;border:1px solid #34383d;border-radius:10px;color:#aeb4bc;background:#0f1114}.status.ok{color:#7be0a1;border-color:#2d6040}.status.bad{color:#ff9b91;border-color:#6b302c}
.controls{display:grid;grid-template-columns:180px minmax(240px,1fr) auto auto;gap:9px;padding:12px 20px;border-bottom:1px solid #292d31;background:#111317}
input,select,button{height:40px;border:1px solid #363b41;border-radius:10px;background:#171a1e;color:#f4f4f4;padding:0 12px;font:inherit;outline:none}input:focus,select:focus{border-color:#ff8a1f;box-shadow:0 0 0 3px #ff7e001d}button{cursor:pointer;font-weight:800}button:hover{background:#22262b}.primary{background:linear-gradient(#ff9738,#f27500);color:#191919;border:0}.danger{border-color:#6a3533;color:#ffaaa4}.good{border-color:#2e6644;color:#86e3a6}
.workspace{min-height:0;display:grid;grid-template-columns:minmax(600px,1.5fr) minmax(330px,.9fr)}.list{min-width:0;border-right:1px solid #2b2f34;display:grid;grid-template-rows:auto 1fr}.tableWrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}th{position:sticky;top:0;background:#191c20;color:#aeb4bc;text-align:left;padding:10px;border-bottom:1px solid #34383d;z-index:1}td{padding:10px;border-bottom:1px solid #262a2f;vertical-align:top}tr.data{cursor:pointer}tr.data:hover{background:#171a1e}tr.data.selected{background:#202832;box-shadow:inset 3px 0 #43bfd0}.empty{padding:26px;color:#7d838b;text-align:center}
.detail{min-width:0;overflow:auto;padding:16px 18px;background:#101215}.detail h2{margin:0 0 10px;font-size:19px}.meta{display:grid;grid-template-columns:120px 1fr;gap:7px 10px;color:#d9dde1}.meta .k{color:#858c95}.items{margin-top:16px;border:1px solid #2c3035;border-radius:12px;overflow:hidden}.item{display:grid;grid-template-columns:1fr 90px 90px;gap:8px;padding:9px 10px;border-bottom:1px solid #292d31;align-items:center}.item:last-child{border-bottom:0}.item.head{background:#191c20;color:#9da4ad;font-size:11px}.item input{height:34px;width:100%;padding:0 8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.actions button{height:42px}.actions .full{grid-column:1/-1}.note{margin-top:10px;color:#7f858d;font-size:12px}
.resend{display:flex;gap:8px;align-items:center;padding:10px 20px;border-bottom:1px solid #272b30;background:#0f1114}.resend span{color:#969da5;font-size:12px}.resend input{flex:1;max-width:320px;height:36px}.resend button{height:36px}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#272c31;color:#cfd4da;font-size:10px;font-weight:800}.badge.new{background:#273a2c;color:#8ee0a5}.badge.bad{background:#422727;color:#ffb1aa}
@media(max-width:980px){.workspace{grid-template-columns:1fr}.detail{display:none}.controls{grid-template-columns:1fr 1fr}.resend{flex-wrap:wrap}}
</style></head><body><div class="app">
<div class="top"><div class="brand">BROOKLYN PIZZA · WINDOWS POS</div><div class="row"><h1>ЕГАИС · входящие ТТН</h1><div id="utmStatus" class="status">Проверка УТМ…</div></div></div>
<div>
  <div class="controls">
    <select id="filter"><option value="new">Новые накладные</option><option value="processed">Обработанные</option><option value="discrepancy">С расхождениями</option><option value="rejected">Отклонённые</option><option value="all">Все накладные</option></select>
    <input id="search" placeholder="Поиск: Рег. ИД, номер, поставщик…">
    <button id="refresh" class="primary">Обновить</button>
    <button id="settings">⚙ Настройки</button>
  </div>
  <div class="resend"><span>Повторный запрос ТТН:</span><input id="resendId" placeholder="Например TTN-0062011806"><button id="resendBtn">Запросить</button><span id="msg"></span></div>
</div>
<div class="workspace">
  <section class="list"><div class="tableWrap"><table><thead><tr><th>Статус</th><th>Рег. ИД</th><th>Номер</th><th>Дата</th><th>Поставщик</th><th>Поз.</th><th>Сумма</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
  <aside class="detail" id="detail"><div class="empty">Выберите накладную слева</div></aside>
</div></div><script>
const api=window.brooklynDesktop;
const $=id=>document.getElementById(id);
let rows=[],selected=null,busy=false;

function text(v){return String(v??'').trim()}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function money(v){return num(v).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2})+' ₽'}
function esc(v){return text(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function pick(o,keys,def=''){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&String(o[k])!=='')return o[k]}return def}
function normStatus(v){
  const s=text(v).toLowerCase();
  if(/new|нов|необраб|status not/.test(s))return 'new';
  if(/discrep|расхожд/.test(s))return 'discrepancy';
  if(/reject|отказ|отклон/.test(s))return 'rejected';
  if(/process|accept|принят|обработ|проведен|проведён/.test(s))return 'processed';
  return s||'new';
}
function normalize(raw,i){
  const items=Array.isArray(raw.positions)?raw.positions:Array.isArray(raw.items)?raw.items:Array.isArray(raw.products)?raw.products:[];
  return {
    _raw:raw,
    id:text(pick(raw,['id','uuid','identity','waybillId','waybill_id'],String(i))),
    regId:text(pick(raw,['regId','wbRegId','WBREGID','ttn','registrationId','reg_id'])),
    number:text(pick(raw,['number','docNumber','NUMBER','waybillNumber'])),
    date:text(pick(raw,['date','docDate','DATE_CREATE','createdAt','shippingDate'])),
    supplier:text(pick(raw,['supplier','supplierName','shipperName','SHIPPER_NAME','vendorName'])),
    status:normStatus(pick(raw,['status','wbStatus','WBSTATUS','state'])),
    total:num(pick(raw,['total','sum','amount','TOTAL'],0)),
    items:items.map((x,j)=>({
      id:text(pick(x,['id','positionId','identity','alcCode','productCode'],String(j))),
      name:text(pick(x,['name','productName','fullName','NAME'],'Позиция '+(j+1))),
      alcCode:text(pick(x,['alcCode','alcoCode','productCode','code'])),
      qty:num(pick(x,['qty','quantity','count','QTY'],0)),
      actualQty:num(pick(x,['actualQty','acceptedQty','quantity','qty'],0)),
      price:num(pick(x,['price','purchasePrice','cost'],0)),
      unit:text(pick(x,['unit','unitType','measure'],'шт.'))
    }))
  }
}
function badge(s){
  const map={new:['Новая','new'],processed:['Обработана',''],discrepancy:['Расхождения','bad'],rejected:['Отклонена','bad']};
  const x=map[s]||[s,''];return '<span class="badge '+x[1]+'">'+esc(x[0])+'</span>'
}
function render(){
  const q=text($('search').value).toLowerCase(),f=$('filter').value;
  const visible=rows.filter(r=>(f==='all'||r.status===f)&&(!q||[r.regId,r.number,r.supplier].join(' ').toLowerCase().includes(q)));
  $('tbody').innerHTML=visible.length?visible.map(r=>'<tr class="data '+(selected?.id===r.id?'selected':'')+'" data-id="'+esc(r.id)+'"><td>'+badge(r.status)+'</td><td><b>'+esc(r.regId||'—')+'</b></td><td>'+esc(r.number||'—')+'</td><td>'+esc(r.date||'—')+'</td><td>'+esc(r.supplier||'—')+'</td><td>'+r.items.length+'</td><td>'+money(r.total)+'</td></tr>').join(''):'<tr><td colspan="7" class="empty">Накладные не найдены</td></tr>';
  document.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{selected=rows.find(r=>r.id===tr.dataset.id);render();renderDetail()})
}
function renderDetail(){
  const d=$('detail');if(!selected){d.innerHTML='<div class="empty">Выберите накладную слева</div>';return}
  const r=selected;
  d.innerHTML='<h2>ТТН '+esc(r.regId||r.number||'')+'</h2><div class="meta">'+
    '<div class="k">Статус</div><div>'+badge(r.status)+'</div>'+
    '<div class="k">Номер</div><div>'+esc(r.number||'—')+'</div>'+
    '<div class="k">Дата</div><div>'+esc(r.date||'—')+'</div>'+
    '<div class="k">Поставщик</div><div>'+esc(r.supplier||'—')+'</div>'+
    '<div class="k">Сумма</div><div>'+money(r.total)+'</div></div>'+
    '<div class="items"><div class="item head"><div>Товар</div><div>По ТТН</div><div>Факт</div></div>'+
    (r.items.length?r.items.map((x,i)=>'<div class="item"><div><b>'+esc(x.name)+'</b><div class="note">'+esc(x.alcCode)+'</div></div><div>'+x.qty+' '+esc(x.unit)+'</div><div><input data-actual="'+i+'" type="number" min="0" max="'+x.qty+'" step="0.001" value="'+x.actualQty+'"></div></div>').join(''):'<div class="empty">Состав накладной не передан адаптером</div>')+
    '</div><div class="actions">'+
      '<button id="accept" class="good" '+(r.status!=='new'?'disabled':'')+'>Принять полностью</button>'+
      '<button id="diff" '+(r.status!=='new'?'disabled':'')+'>Акт расхождений</button>'+
      '<button id="reject" class="danger full" '+(r.status!=='new'?'disabled':'')+'>Отказать в приёмке</button>'+
    '</div><div class="note">Для акта расхождений укажите фактически принятое количество в колонке «Факт».</div>';
  document.querySelectorAll('[data-actual]').forEach(inp=>inp.oninput=()=>{const i=Number(inp.dataset.actual);r.items[i].actualQty=Math.max(0,Math.min(r.items[i].qty,num(inp.value)))});
  if($('accept')) $('accept').onclick=()=>armedAction($('accept'),'Принять?',()=>doAction('egais.accept'));
  if($('diff')) $('diff').onclick=()=>armedAction($('diff'),'Отправить акт?',()=>doAction('egais.discrepancy'));
  if($('reject')) $('reject').onclick=()=>armedAction($('reject'),'Отказать?',()=>doAction('egais.reject'));
}
function armedAction(btn,label,fn){
  if(btn.dataset.armed==='1'){btn.dataset.armed='0';btn.textContent=btn.dataset.label||label;fn();return}
  btn.dataset.label=btn.textContent;btn.dataset.armed='1';btn.textContent='Нажмите ещё раз';btn.style.background='#1f8f4d';btn.style.color='white';
  setTimeout(()=>{if(btn.dataset.armed==='1'){btn.dataset.armed='0';btn.textContent=btn.dataset.label;btn.style.background='';btn.style.color=''}},3500)
}
async function checkUtm(){
  const r=await api.hardwareCommand('egais.ping',{});
  const s=$('utmStatus');if(r?.ok){s.textContent='УТМ: подключен';s.className='status ok'}else{s.textContent='УТМ: '+(r?.error||'нет связи');s.className='status bad'}
}
async function refresh(){
  if(busy)return;busy=true;$('refresh').disabled=true;$('refresh').textContent='Загрузка…';$('msg').textContent='';
  try{
    await checkUtm();
    const r=await api.hardwareCommand('egais.incoming',{status:$('filter').value,query:text($('search').value)});
    if(!r?.ok){$('msg').textContent=r?.error||'Не удалось получить ТТН';rows=[];render();return}
    const arr=Array.isArray(r.items)?r.items:Array.isArray(r.waybills)?r.waybills:Array.isArray(r.documents)?r.documents:Array.isArray(r.data)?r.data:[];
    rows=arr.map(normalize);if(selected)selected=rows.find(x=>x.id===selected.id)||null;render();renderDetail();$('msg').textContent='Получено: '+rows.length
  }catch(e){$('msg').textContent=e.message||String(e)}
  finally{busy=false;$('refresh').disabled=false;$('refresh').textContent='Обновить'}
}
async function doAction(channel){
  if(!selected||busy)return;busy=true;$('msg').textContent='Отправка в УТМ…';
  const payload={id:selected.id,regId:selected.regId,waybill:selected._raw,positions:selected.items.map(x=>({id:x.id,actualQty:x.actualQty,qty:x.qty}))};
  try{const r=await api.hardwareCommand(channel,payload);$('msg').textContent=r?.ok?'Операция отправлена в УТМ':(r?.error||'Ошибка операции');if(r?.ok)setTimeout(refresh,500)}
  catch(e){$('msg').textContent=e.message||String(e)}finally{busy=false}
}
$('refresh').onclick=refresh;$('filter').onchange=refresh;$('search').oninput=render;$('settings').onclick=()=>api.openHardwareSettings();
$('resendBtn').onclick=async()=>{const regId=text($('resendId').value);if(!regId){$('msg').textContent='Введите Рег. ИД ТТН';return} $('msg').textContent='Запрашиваю ТТН…';const r=await api.hardwareCommand('egais.resend',{regId});$('msg').textContent=r?.ok?'Повторный запрос отправлен в УТМ':(r?.error||'Не удалось отправить запрос')};
checkUtm();refresh();
</script></body></html>
